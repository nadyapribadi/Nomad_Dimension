[build]
  # Publish only the curated static copy. `.` would upload the generated
  # GitNexus index, Graphify output, Docs, and every agent/config file.
  publish = "_deploy"
  functions = "functions"
  # Skip the production deploy (saves build credits) when a commit touches only
  # docs / tests / CI. exit 0 = skip build, non-zero = build. If we can't diff
  # (first build / shallow clone), build.
  ignore = """
    git rev-parse HEAD^ >/dev/null 2>&1 || exit 1
    git diff --name-only HEAD^ HEAD | grep -qvE '^(Docs/|\\.github/|[^/]*\\.md$|.*\\.test\\.js$)' && exit 1 || exit 0
  """

# Netlify Dev serves the working tree so local edits stay live, even though
# deploys publish the curated _deploy/ directory.
[dev]
  publish = "."

# Synchronous functions use the platform default; application requests have bounded deadlines.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/Docs/*"
  to = "/404.html"
  status = 404
  force = true

